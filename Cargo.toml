[package]
name = "dnd_scheduler"
version = "0.1.0"
edition = "2021"
default-run = "dnd_scheduler"
autobins = false

[[bin]]
name = "dnd_scheduler"
path = "src/main.rs"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie", "cookie-signed", "typed-header"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tower = { version = "0.4", features = ["limit", "buffer", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.17.1"
# Updated to latest to fix rustls-pemfile unmaintained warning
reqwest = { version = "0.12", features = ["json"] }
tower_governor = "0.4"
zxcvbn = "3.1.0"
rand = "0.8"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }
redb = "2.1"
bincode = "1.3"
anyhow = "1.0"
async-trait = "0.1"
rrule = "0.14.0"
ics = "0.5"
dashmap = "6.1.0"
nanoid = "0.4"
chrono-tz = "0.10.4"

[dev-dependencies]
axum-test = "15.0"
once_cell = "1.19"
tempfile = "3.8"
